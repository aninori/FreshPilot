[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freshpilot"]

[project]
name = "freshpilot"
version = "0.1.0"
description = "FreshPilot — agentic operations layer for fresh-grocery ordering (synthetic-data proof of concept)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pint>=0.24",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    "mlflow>=2.16",
    "langgraph>=0.2",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["freshpilot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["freshpilot.engine.*", "freshpilot.guardrails.*"]
strict = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pandas.*", "sklearn.*", "pint.*", "scipy.*", "shap.*", "lightgbm.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
