[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freshpilot"]

[project]
name = "freshpilot"
version = "0.1.0"
description = "FreshPilot — agentic operations layer for fresh-grocery ordering (synthetic-data proof of concept)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["freshpilot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["freshpilot.engine.*", "freshpilot.guardrails.*"]
strict = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
